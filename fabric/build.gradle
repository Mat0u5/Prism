plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	accessWidenerPath = file("${project(':common').projectDir}/src/main/resources/prism.accesswidener")
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	// Files in this configuration will be bundled into your mod using the Shadow plugin.
	// Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	implementation "net.fabricmc:fabric-loader:$rootProject.fabricLoaderVersion"
	implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabricVersion"

	common(project(path: ":common")) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
	inputs.property "modId", rootProject.modId
	inputs.property "version", rootProject.version
	inputs.property "displayName", rootProject.displayName

	filesMatching("fabric.mod.json") {
		expand (
			modId: rootProject.modId,
			version: rootProject.version,
			displayName: rootProject.displayName
		)
	}
	outputs.upToDateWhen { false }
}

jar {
	archiveClassifier = 'raw'
}

shadowJar {
	dependsOn(jar)
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))

	configurations = [project.configurations.shadowBundle]
	archiveClassifier = null

	minimize {
		exclude(project(':common'))
	}

	destinationDirectory = file("$buildDir/../../output")
}