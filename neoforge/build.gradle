plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	// Files in this configuration will be bundled into your mod using the Shadow plugin.
	// Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:$rootProject.neoforgeVersion"

	common(project(path: ":common")) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
	inputs.property "modId", project.modId
	inputs.property "version", project.version
	inputs.property "displayName", rootProject.name

	filesMatching("META-INF/neoforge.mods.toml") {
		expand (
			modId: project.modId,
			version: project.version,
			displayName: rootProject.name
		)

		filter { String line -> line.replace("[[modDependency]]", "[[dependencies.${project.modId}]]") }
	}
	outputs.upToDateWhen { false }
}

jar {
	archiveClassifier = 'raw'
}

shadowJar {
	dependsOn(jar)
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))

	configurations = [project.configurations.shadowBundle]
	archiveClassifier = null
}

tasks.named('shadowJar').configure {
	destinationDirectory = file("$buildDir/../../output")
}

