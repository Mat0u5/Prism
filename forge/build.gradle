plugins {
	id 'io.github.goooler.shadow'
}

loom {
	forge {
		mixinConfig "prism.mixins.json"
	}
}

architectury {
	platformSetupLoomIde()
	forge()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common

	// Files in this configuration will be bundled into your mod using the Shadow plugin.
	// Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	forge "net.minecraftforge:forge:$rootProject.forgeVersion"

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
	inputs.property "modId", project.modId
	inputs.property "version", project.version
	inputs.property "displayName", rootProject.name

	filesMatching("META-INF/mods.toml") {
		expand (
			modId: project.modId,
			version: project.version,
			displayName: rootProject.name
		)

		filter { String line -> line.replace("[[modDependency]]", "[[dependencies.${rootProject.modId}]]") }
	}
	outputs.upToDateWhen { false }
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
}

remapJar {
	input.set shadowJar.archiveFile
	atAccessWideners.add('prism.accesswidener')
}
